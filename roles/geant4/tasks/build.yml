---
- name: Check for cached Geant4 archive
  ansible.builtin.stat:
    path: "/opt/geant4-{{ geant4_version }}.tar.gz"
    get_checksum: false
  register: geant4_archive

- name: Download Geant4 source archive
  ansible.builtin.get_url:
    url: "https://github.com/Geant4/geant4/archive/refs/tags/v{{ geant4_version }}.tar.gz"
    dest: "/opt/geant4-{{ geant4_version }}.tar.gz"
    mode: "0644"
  when: not geant4_archive.stat.exists

- name: Extract Geant4 source
  ansible.builtin.unarchive:
    src: "/opt/geant4-{{ geant4_version }}.tar.gz"
    dest: /opt
    remote_src: true
    creates: "{{ geant4_source_dir }}/CMakeLists.txt"

- name: Create Geant4 build directory
  ansible.builtin.file:
    path: "{{ geant4_build_dir }}"
    state: directory
    mode: "0755"

- name: Configure Geant4
  ansible.builtin.command:
    argv:
      - cmake
      - "-DCMAKE_INSTALL_PREFIX={{ geant4_prefix }}"
      - "-DGEANT4_INSTALL_DATA={{ geant4_install_data | ternary('ON', 'OFF') }}"
      - "-DGEANT4_USE_OPENGL_X11={{ geant4_use_opengl_x11 | ternary('ON', 'OFF') }}"
      - "-DGEANT4_USE_QT={{ geant4_use_qt | ternary('ON', 'OFF') }}"
      - "-DGEANT4_BUILD_MULTITHREADED={{ geant4_build_multithreaded | ternary('ON', 'OFF') }}"
      - "-DGEANT4_USE_GDML={{ geant4_use_gdml | ternary('ON', 'OFF') }}"
      - "{{ geant4_source_dir }}"
    chdir: "{{ geant4_build_dir }}"

- name: Build Geant4
  ansible.builtin.command:
    argv:
      - cmake
      - --build
      - "{{ geant4_build_dir }}"
      - --parallel
      - "{{ ansible_facts['processor_vcpus'] | default(2) }}"

- name: Install Geant4
  ansible.builtin.command:
    argv:
      - cmake
      - --install
      - "{{ geant4_build_dir }}"
