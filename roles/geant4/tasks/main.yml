---
- name: Install build dependencies
  ansible.builtin.import_tasks: dependencies.yml

- name: Download and build Geant4
  ansible.builtin.import_tasks: build.yml

- name: Configure the Geant4 environment
  ansible.builtin.import_tasks: environment.yml

- name: Clean Geant4 build directory
  ansible.builtin.file:
    path: "{{ geant4_build_dir }}"
    state: absent
  when: geant4_clean_build | default(false) | bool
