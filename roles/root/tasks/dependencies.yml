---
- name: Install ROOT runtime dependencies
  ansible.builtin.apt:
    name:
      - binutils
      - cmake
      - dpkg-dev
      - g++
      - gcc
      - git
      - libfontconfig1-dev
      - libfreetype-dev
      - libgif-dev
      - libgl1-mesa-dev
      - libglu1-mesa-dev
      - libpng-dev
      - libssl-dev
      - libtbb-dev
      - libvdt-dev
      - libx11-dev
      - libxext-dev
      - libxft-dev
      - libxmu-dev
      - libxpm-dev
      - python3
      - python3-dev
    state: present
    update_cache: true
    cache_valid_time: 3600
