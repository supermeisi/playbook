---
- name: Install ROOT dependencies
  ansible.builtin.import_tasks: dependencies.yml

- name: Download ROOT source and configure the build
  ansible.builtin.import_tasks: source.yml

- name: Build and install ROOT
  ansible.builtin.import_tasks: build.yml

- name: Configure the ROOT environment
  ansible.builtin.import_tasks: environment.yml

- name: Clean ROOT build directory
  ansible.builtin.file:
    path: "{{ root_build_dir }}"
    state: absent
  when: root_clean_build | default(false) | bool
