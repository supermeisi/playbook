---
- name: Software installation and configuration playbook
  hosts: localhost
  connection: local
  become: true
  pre_tasks:
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      tags: [always, update]

    - name: Configure pending packages
      ansible.builtin.command:
        cmd: dpkg --configure --pending
      register: dpkg_configure
      changed_when: dpkg_configure.stdout | length > 0
      tags: [always, update]

    - name: Fix broken packages
      ansible.builtin.command:
        cmd: apt-get --fix-broken install --assume-yes
      register: fix_broken_packages
      changed_when: false
      tags: [always, update]

    - name: Upgrade Ubuntu packages
      ansible.builtin.apt:
        upgrade: dist
      tags: [always, update]

    - name: Check whether snap is installed
      ansible.builtin.stat:
        path: /usr/bin/snap
      register: snap_executable
      tags: [always, update]

    - name: Update Snap packages
      ansible.builtin.command:
        cmd: snap refresh
      when: snap_executable.stat.exists
      register: snap_refresh
      changed_when: "'All snaps up to date' not in snap_refresh.stdout"
      tags: [always, update]

    - name: Check whether Flatpak is installed
      ansible.builtin.stat:
        path: /usr/bin/flatpak
      register: flatpak_executable
      tags: [always, update]

    - name: Update Flatpak applications
      ansible.builtin.command:
        cmd: flatpak update --system --assumeyes
      when: flatpak_executable.stat.exists
      register: flatpak_update
      changed_when: "'Nothing to do.' not in flatpak_update.stdout"
      tags: [always, update]

    - name: Install fwupd firmware updater
      ansible.builtin.apt:
        name: fwupd
        state: present
      tags: [always, update]

    - name: Refresh firmware metadata
      ansible.builtin.command:
        cmd: fwupdmgr refresh --force
      register: firmware_refresh
      changed_when: firmware_refresh.rc == 0
      failed_when: firmware_refresh.rc not in [0]
      tags: [always, update]

    - name: Update firmware
      ansible.builtin.command:
        cmd: fwupdmgr update --assume-yes
      register: firmware_update
      changed_when: firmware_update.rc == 0
      failed_when: firmware_update.rc not in [0, 2]
      tags: [always, update]

  roles:
    - role: geant4
      tags: [geant4, hep]
    - role: root
      tags: [root, hep]
    - role: zoom
      tags: [zoom, video, communication, flatpak]
    - role: zapzap
      tags: [zapzap, video, communication, flatpak]
    - role: telegram
      tags: [telegram, video, communication, flatpak]
    - role: teams
      tags: [teams, video, communication, flatpak]
    - role: discord
      tags: [discord, flatpak, video, communication]
    - role: mattermost
      tags: [mattermost, flatpak, communication]
